<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCPH Waste Segregation Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f6f8f6; --card:#ffffff; --ink:#15221d; --muted:#5d6b65; --line:#d9e0dc;
  --green:#0c6b58; --green-dark:#084c3f; --green-soft:#e3f1ec;
  --amber:#b7791f; --amber-soft:#fdf3dc; --red:#b3261e; --red-soft:#fbe9e7;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Kantumruy Pro","Noto Sans Khmer","Khmer OS Battambang",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}

header.top{background:var(--green-dark);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:1.05rem;font-weight:600;margin:0;flex:1;line-height:1.35}
header.top small{display:block;font-weight:400;opacity:.8;font-size:.8rem}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}

nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current=true]{color:var(--green-dark);border-bottom-color:var(--green)}

main{padding:16px 0 70px}
h2{font-size:1.15rem;margin:0 0 12px;font-weight:600}
h3{font-size:1rem;margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-weight:500;margin:14px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=month],select,textarea{
  width:100%;padding:10px;border:1px solid #b9c4be;border-radius:8px;background:#fff;min-height:44px}
textarea{min-height:70px;resize:vertical}

/* weight rows: the bin colour strip identifies each category */
.w{display:grid;grid-template-columns:8px 1fr 104px 22px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.w i{display:block;width:8px;height:38px;border-radius:4px}
.w input{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.w-total{display:flex;justify-content:space-between;padding:10px 0 0;font-weight:600}

.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;flex:none}
.seg button{border:1px solid #b9c4be;background:#fff;padding:8px 14px;min-width:64px;min-height:44px;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg button.on.y{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.n{background:var(--red);border-color:var(--red);color:#fff}

.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{background:var(--green-dark)}
.btn.line{background:#fff;color:var(--green-dark);border:1px solid var(--green)}
.btn.warn{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.full{width:100%;margin-top:18px}

.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:600}
.pill.submitted{background:var(--amber-soft);color:var(--amber)}
.pill.approved{background:var(--green-soft);color:var(--green-dark)}
.pill.returned{background:var(--red-soft);color:var(--red)}
.entry-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kgs{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0;font-variant-numeric:tabular-nums}
.kgs span{display:inline-flex;align-items:center;gap:5px;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.note{background:var(--red-soft);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.9rem}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--muted)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;background:#eef2ef}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.bar{display:flex;height:12px;min-width:90px;border-radius:3px;overflow:hidden;background:#eef2ef}
.bar i{display:block;height:100%}
.low{color:var(--red);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:5px}

.demo{background:var(--amber-soft);border-bottom:1px solid #ecd9a6;font-size:.88rem;padding:6px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:92vw;z-index:20}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px;text-align:center;font-size:.9rem}
.sign div{border-top:1px solid var(--ink);padding-top:6px}
.login{max-width:420px;margin:28px auto}

@media print{
  header.top,nav.tabs,.noprint,.toast,.demo{display:none!important}
  body{background:#fff;font-size:11pt}
  main{padding:0}
  .card{border:0;padding:0}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ============ STATE ============ */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowLocal = () => { const d=new Date(); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

const t = k => T[k][S.lang==='km'?1:0];
const L = o => S.lang==='km' ? o.km : o.en;
const both = o => `${o.en} / ${o.km}`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = n => (Math.round(n*10)/10).toFixed(1);
const $ = s => document.querySelector(s);
const isOk = e => CHECKS.every(c => e[c.k]===true);
const sumKg = e => CATS.reduce((a,c)=>a+(+e[c.k]||0),0);

/* ============ API ============ */
async function api(action, params={}) {
  if (!API_URL) return demo(action, params);
  const q = new URLSearchParams({action, ...(S.cred||{}), ...params});
  const r = await fetch(API_URL + '?' + q.toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

/* ---- demo mode: same rules as Code.gs, data kept in memory only ---- */
let DB = null;
function seedDB() {
  let s = 7; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  const r1 = x => Math.round(x*10)/10;
  const users = [{id:'admin',name:'Technical Office',role:'admin',ward:''},{id:'mgmt',name:'Hospital management',role:'viewer',ward:''}];
  WARDS.forEach((w,i) => { users.push({id:'n'+i,name:'Nurse, '+w,role:'nurse',ward:w}); users.push({id:'l'+i,name:'IPC link, '+w,role:'link',ward:w}); });

      const sc = 0.6 + ((wi*37)%10)/10, bad = rnd() > (0.78 + ((wi*13)%20)/100), bi = Math.floor(rnd()*3);
      const age = (now - d)/864e5;
      const status = age > 3 ? 'approved' : (rnd()<0.12 ? 'returned' : (rnd()<0.45 ? 'approved' : 'submitted'));
      entries.push({ id:'d'+(++n), datetime:dt, ward:w, recorder:'Nurse, '+w,
        general:r1(1.5+rnd()*5*sc), infectious:r1(0.8+rnd()*3.5*sc), pathological:r1(rnd()<0.6?0:rnd()*1.5*sc), sharps:r1(0.1+rnd()*0.8*sc), pharma:r1(rnd()<0.7?0:rnd()*0.6),
        chkColour:!(bad&&bi===0), chkNoMix:!(bad&&bi===1), chkSharps:!(bad&&bi===2), errorType: bad?errOf[bi]:'', remarks:'',
        status, reviewedBy: status==='submitted'?'':'IPC link, '+w, reviewedAt: status==='submitted'?'':dt,
        reviewNote: status==='returned'?'Please re-weigh the infectious waste.':'', createdBy:'n'+wi });
    }));
  }
  return {users, entries};
}
function demo(action, p) {
  DB = DB || seedDB();
  if (action==='users') return DB.users;
  if (action==='login') {
    const u = DB.users.find(x => x.id===S.cred.id);
    if (!u || S.cred.pin!=='1234') throw new Error('Wrong name or PIN');
    return u;
  }
  const u = S.user;
  if (action==='list') return DB.entries.filter(e => e.datetime>=p.from && e.datetime<=p.to && (!u.ward || e.ward===u.ward)).map(e=>({...e}));
  if (action==='save') {
    const d = JSON.parse(p.data);
    const o = {...d, ward: u.role==='admin'?d.ward:u.ward, status:'submitted', reviewedBy:'', reviewedAt:''};
    if (d.id) {
      const ex = DB.entries.find(e=>e.id===d.id);
      if (ex.status==='approved') throw new Error('Approved entries cannot be edited');
      Object.assign(ex, o, {recorder:ex.recorder, createdBy:ex.createdBy});
      return ex;
    }
    Object.assign(o, {id:'x'+Date.now(), recorder:u.name, createdBy:u.id, reviewNote:''});
    DB.entries.push(o); return o;
  }
  if (action==='review') {
    const ex = DB.entries.find(e=>e.id===p.entryId);
    Object.assign(ex, {status:p.status, reviewedBy:u.name, reviewedAt:nowLocal(), reviewNote:p.note||''});
    return ex;
  }
}

/* ============ DATA HELPERS ============ */
async function load() {
  S.entries = await api('list', {from:S.month+'-01T00:00', to:S.month+'-31T23:59'});
  S.entries.sort((a,b)=> a.datetime<b.datetime ? 1 : -1);
}
function newDraft() {
  const d = {id:'', datetime:nowLocal(), ward:S.user.ward||WARDS[0], errorType:'', remarks:''};
  CATS.forEach(c=>d[c.k]=''); CHECKS.forEach(c=>d[c.k]=null);
  return d;
}
function aggregate(list, wards) {
  const by = {};
  wards.forEach(w => { by[w] = {ward:w, rounds:0, ok:0, total:0}; CATS.forEach(c=>by[w][c.k]=0); });
  list.forEach(e => {
    const w = by[e.ward]; if (!w) return;
    w.rounds++; if (isOk(e)) w.ok++;
    CATS.forEach(c => { w[c.k] += +e[c.k]||0; w.total += +e[c.k]||0; });
  });
  const rows = wards.map(w=>by[w]);
  const tot = {ward:t('total'), rounds:0, ok:0, total:0}; CATS.forEach(c=>tot[c.k]=0);
  rows.forEach(r => { tot.rounds+=r.rounds; tot.ok+=r.ok; tot.total+=r.total; CATS.forEach(c=>tot[c.k]+=r[c.k]); });
  return {rows, tot};
}
const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '-';
const myWards = () => S.user.ward ? [S.user.ward] : WARDS;

const toast = () => S.msg ? `<div class="toast" role="status">${esc(S.msg)}</div>` : '';

      <button class="n ${d[c.k]===false?'on':''}" data-act="chk" data-k="${c.k}" data-v="0" aria-pressed="${d[c.k]===false}">${t('no')}</button></span></div>`).join('')}
    ${anyNo ? `<label class="f">${t('err')}</label><select data-f="errorType"><option value="">${t('choose')}</option>${ERRS.map(e=>`<option value="${e.k}" ${d.errorType===e.k?'selected':''}>${L(e)}</option>`).join('')}</select>` : ''}

function entriesView() {
  const canReview = S.user.role==='link' || S.user.role==='admin';
  const filter = `<select data-ch="status" style="width:auto"><option value="">${t('all')}</option>${['submitted','returned','approved'].map(s=>`<option value="${s}" ${S.statusFilter===s?'selected':''}>${t(s)}</option>`).join('')}</select>`;

      <div class="kgs">${CATS.map(c=>`<span title="${esc(L(c))}"><i class="dot" style="background:${c.c}"></i>${f1(+e[c.k]||0)}</span>`).join('')}<span><b>${t('total')} ${f1(sumKg(e))} ${t('kg')}</b></span></div>
      <div class="muted">${t('quality')}: ${isOk(e) ? t('yes') : `<span class="low">${t('no')}, ${esc(errName)}</span>`}${e.remarks?`<br>${esc(e.remarks)}`:''}</div>
      ${e.status==='returned' && e.reviewNote ? `<div class="note">${esc(e.reviewNote)} <span class="muted">(${esc(e.reviewedBy)})</span></div>` : ''}
      ${e.status==='approved' ? `<div class="muted">${t('reviewedBy')}: ${esc(e.reviewedBy)}</div>` : ''}
      <div class="row" style="margin-top:10px">

        ${mine && e.status!=='approved' && S.user.role!=='viewer' ? `<button class="btn line" data-act="edit" data-id="${esc(e.id)}">${t('edit')}</button>` : ''}
      </div></div>`;
  }).join('');
  return `<h2>${t('t_entries')}</h2>${monthBar(filter)}${cards || `<div class="card muted">${t('empty')}</div>`}`;

function dashView() {
  const live = S.entries.filter(e=>e.status!=='returned');
  const {rows, tot} = aggregate(live, myWards());
  const pending = S.entries.filter(e=>e.status==='submitted').length;
  const today = nowLocal().slice(0,10);
  const todayWards = new Set(S.entries.filter(e=>e.datetime.slice(0,10)===today).map(e=>e.ward)).size;
  const max = Math.max(1, ...rows.map(r=>r.total));
  const lastTile = S.user.ward
    ? `<div class="tile"><b>${tot.rounds}</b><span>${t('d_rounds')}</span></div>`
    : `<div class="tile"><b>${todayWards} / ${WARDS.length}</b><span>${t('d_today')}</span></div>`;
  const errs = {}; live.forEach(e=>{ if(e.errorType) errs[e.errorType]=(errs[e.errorType]||0)+1; });
  const errRows = Object.entries(errs).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(L(ERRS.find(x=>x.k===k)||{en:k,km:k}))}</td><td>${n}</td></tr>`).join('');
  return `<h2>${t('t_dash')}</h2>${monthBar()}
    <div class="tiles">
      <div class="tile"><b>${f1(tot.total)}</b><span>${t('d_total')}</span></div>
      <div class="tile"><b>${pct(tot.ok,tot.rounds)}</b><span>${t('d_comp')}</span></div>
      <div class="tile"><b>${pending}</b><span>${t('d_pending')}</span></div>
      ${lastTile}
    </div>
    <h3>${t('d_byward')}</h3>
    <div class="card scroll"><table>
      <thead><tr><th>${t('ward')}</th><th>${t('rounds')}</th><th style="text-align:left">${t('weights')}</th><th>${t('kg')}</th><th>${t('comp')}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.ward)}</td><td class="${r.rounds?'':'low'}">${r.rounds}</td>
        <td><div class="bar" style="width:${Math.max(4,r.total/max*100)}%">${CATS.map(c=>`<i style="background:${c.c};width:${r.total?r[c.k]/r.total*100:0}%"></i>`).join('')}</div></td>
        <td>${f1(r.total)}</td><td class="${r.rounds && r.ok/r.rounds<0.8?'low':''}">${pct(r.ok,r.rounds)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="legend">${CATS.map(c=>`<span><i class="dot" style="background:${c.c}"></i>${L(c)}</span>`).join('')}</div></div>
    <h3>${t('d_errors')}</h3>
    <div class="card">${errRows ? `<table><tbody>${errRows}</tbody></table>` : `<span class="muted">${t('d_noerr')}</span>`}</div>
    <p class="muted">${t('d_scope')}</p>`;
}

function reportData() {
  const wards = S.repWard ? [S.repWard] : myWards();
  return aggregate(S.entries.filter(e=>e.status==='approved'), wards);
}
function reportView() {
  const {rows, tot} = reportData();
  const wardSel = S.user.ward ? '' : `<select data-ch="repWard" style="width:auto"><option value="">${t('allwards')}</option>${WARDS.map(w=>`<option ${w===S.repWard?'selected':''}>${esc(w)}</option>`).join('')}</select>`;
  const line = r => `<td>${r.rounds}</td>${CATS.map(c=>`<td>${f1(r[c.k])}</td>`).join('')}<td>${f1(r.total)}</td><td>${pct(r.ok,r.rounds)}</td>`;
  return `${monthBar(wardSel)}
    <div class="card" id="report">
      <div style="text-align:center"><b>${T.hosp[1]}</b><br>${T.hosp[0]}<br>
        <h2 style="margin:10px 0 2px">${T.r_title[1]}</h2><div>${T.r_title[0]}</div>
        <div>${t('month')}: <b>${S.month}</b>${S.repWard||S.user.ward ? `, ${t('ward')}: <b>${esc(S.repWard||S.user.ward)}</b>` : ''}</div></div>
      <div class="scroll" style="margin-top:14px"><table>
        <thead><tr><th>${t('ward')}</th><th>${t('rounds')}</th>${CATS.map(c=>`<th style="white-space:normal;min-width:74px">${L(c)}</th>`).join('')}<th>${t('total')} (${t('kg')})</th><th>${t('comp')}</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${esc(r.ward)}</td>${line(r)}</tr>`).join('')}</tbody>
        ${rows.length>1 ? `<tfoot><tr><td>${t('total')}</td>${line(tot)}</tr></tfoot>` : ''}

      <button class="btn" data-act="xlsx">${t('xlsx')}</button>
      <button class="btn line" data-act="print">${t('print')}</button>

function exportXlsx() {
  const {rows, tot} = reportData();
  const head = ['Ward / ផ្នែក','Rounds / ជុំ', ...CATS.map(c=>both(c)+' (kg)'), 'Total / សរុប (kg)', 'Compliant rounds / ជុំអនុលោម', 'Compliance / អត្រាអនុលោម (%)'];
  const line = r => [r.ward, r.rounds, ...CATS.map(c=>+f1(r[c.k])), +f1(r.total), r.ok, r.rounds ? Math.round(r.ok/r.rounds*100) : ''];
  const summary = [[T.hosp[0]+' / '+T.hosp[1]], [T.r_title[0]+' / '+T.r_title[1]], ['Month / ខែ', S.month], [], head, ...rows.map(line)];
  if (rows.length>1) summary.push(line({...tot, ward:'Total / សរុប'}));
  const wards = S.repWard ? [S.repWard] : myWards();
  const rawHead = ['Date and time','Ward','Recorded by', ...CATS.map(c=>both(c)+' (kg)'), 'Total (kg)', ...CHECKS.map(c=>c.en), 'Error type','Remarks','Status','Reviewed by','Reviewed at','Review note'];
  const raw = [rawHead, ...S.entries.filter(e=>wards.includes(e.ward)).slice().reverse().map(e=>[
    e.datetime.replace('T',' '), e.ward, e.recorder, ...CATS.map(c=>+e[c.k]||0), +f1(sumKg(e)), ...CHECKS.map(c=>e[c.k]?'Yes':'No'),
    e.errorType ? (ERRS.find(x=>x.k===e.errorType)||{en:e.errorType}).en : '', e.remarks, e.status, e.reviewedBy, String(e.reviewedAt||'').replace('T',' '), e.reviewNote])];
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(summary); ws1['!cols'] = head.map((_,i)=>({wch:i?18:26}));
  const ws2 = XLSX.utils.aoa_to_sheet(raw); ws2['!cols'] = rawHead.map(()=>({wch:18}));
  XLSX.utils.book_append_sheet(wb, ws1, 'Summary');
  XLSX.utils.book_append_sheet(wb, ws2, 'Records');
  XLSX.writeFile(wb, `KCPH-waste-${S.month}${S.repWard?'-'+S.repWard.replace(/\s+/g,'_'):''}.xlsx`);
}

/* ============ ACTIONS ============ */
async function run(fn) { try { await fn(); } catch (err) { say(err.message || String(err)); } }

const ACT = {
  lang() { S.lang = S.lang==='km' ? 'en' : 'km'; render(); },
  async login() {
    S.cred = {id:$('#lu').value, pin:$('#lp').value.trim()};
    S.user = await api('login'); S.tab = TABS[S.user.role][0]; S.draft = newDraft(); S.repWard=''; S.statusFilter='';
    await load(); render();
  },
  logout() { S.user=null; S.cred=null; S.entries=[]; render(); },
  tab(el) { S.tab = el.dataset.k; render(); window.scrollTo(0,0); },
  chk(el) { S.draft[el.dataset.k] = el.dataset.v==='1'; if (!CHECKS.some(c=>S.draft[c.k]===false)) S.draft.errorType=''; render(); },
  async save() {
    const d = S.draft;
    if (!d.datetime) return say(t('v_date'));
    if (CATS.some(c => d[c.k]==='' || isNaN(+d[c.k]) || +d[c.k]<0)) return say(t('v_weights'));
    if (CHECKS.some(c => d[c.k]===null)) return say(t('v_checks'));
    if (CHECKS.some(c => d[c.k]===false) && !d.errorType) return say(t('v_err'));
    const payload = {...d}; CATS.forEach(c=>payload[c.k]=+d[c.k]);
    await api('save', {data:JSON.stringify(payload)});
    S.draft = newDraft(); await load(); S.tab = 'entries'; say(t('saved'));
  },
  cancelEdit() { S.draft = newDraft(); S.tab='entries'; render(); },
  edit(el) { const e = S.entries.find(x=>x.id===el.dataset.id); S.draft = {...e}; S.tab='entry'; render(); window.scrollTo(0,0); },
  async approve(el) { await review(el.dataset.id, 'approved'); },
  async return(el) { await review(el.dataset.id, 'returned'); },
  xlsx() { exportXlsx(); },
  print() { window.print(); }
};
async function review(id, status) {
  const note = ($('#note_'+CSS.escape(id))||{}).value || '';
  if (status==='returned' && !note.trim()) return say(t('v_note'));
  await api('review', {entryId:id, status, note:note.trim()});
  await load(); say(t(status));
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  run(() => ACT[el.dataset.act](el));
});
document.addEventListener('input', ev => {
  const f = ev.target.dataset.f; if (!f || !S.draft) return;
  S.draft[f] = ev.target.value;
  const tot = $('#tot'); if (tot) tot.textContent = f1(sumKg(S.draft));
});
document.addEventListener('change', ev => {
  const c = ev.target.dataset.ch; if (!c) return;
  if (c==='month' && ev.target.value) { S.month = ev.target.value; run(async()=>{ await load(); render(); }); }
  if (c==='status') { S.statusFilter = ev.target.value; render(); }
  if (c==='repWard') { S.repWard = ev.target.value; render(); }
});
document.addEventListener('keydown', ev => { if (ev.key==='Enter' && ev.target.id==='lp') run(()=>ACT.login()); });

run(async () => { render(); S.users = await api('users'); render(); });
